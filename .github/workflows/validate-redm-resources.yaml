name: Validate RedM Resources Repository

on:
  workflow_call:
    inputs:
      validate_lua:
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate resources repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v5

      - name: Validation placeholder
        shell: bash
        run: |
          set -euo pipefail

          echo "Resources repository validation placeholder."
          echo "Lua validation enabled: ${{ inputs.validate_lua }}"
          echo "Validation rules will be added in a later commit."
